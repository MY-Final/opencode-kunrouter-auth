<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KunRouter 连接</title>
  <link rel="stylesheet" href="style.css">
  <script src="_magpie/bridge.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <form id="settings" aria-label="连接设置">
    <div class="protocols" role="tablist" aria-label="协议">
      <button type="button" role="tab" data-protocol="chat" aria-selected="true" aria-controls="connection">OpenAI 兼容</button>
      <button type="button" role="tab" data-protocol="responses" aria-selected="false" aria-controls="connection" tabindex="-1">Responses</button>
      <button type="button" role="tab" data-protocol="anthropic" aria-selected="false" aria-controls="connection" tabindex="-1">Messages</button>
      <button type="button" role="tab" data-protocol="gemini" aria-selected="false" aria-controls="connection" tabindex="-1">Gemini</button>
    </div>
    <div id="connection" role="tabpanel">
      <div class="address">
        <label for="base-url">Base URL</label>
        <input id="base-url" type="url" placeholder="自动跟随登录入口" spellcheck="false" autocomplete="off" aria-label="Base URL">
        <button id="apply" type="submit">应用</button>
      </div>
      <div class="detection">
        <button id="detect" type="button">检测协议</button>
        <input id="model" type="text" placeholder="试用模型（可留空）" autocomplete="off" spellcheck="false" maxlength="200" aria-label="试用模型">
        <span id="status" class="status" role="status" aria-live="polite"></span>
      </div>
    </div>
    <div id="results" class="results" aria-label="检测结果" hidden></div>
  </form>
</body>
</html>
