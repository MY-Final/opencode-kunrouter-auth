name: 功能建议
description: 想要插件多一个能力，或者现有交互不好用
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        说一下想解决什么问题，比直接说「加个按钮」更容易做对。另外有些东西 Magpie 的插件规范本身就不允许（比如插件页面不能发网络请求、不能读账号密钥），这类需求会卡在上游。
  - type: textarea
    id: problem
    attributes:
      label: 你现在遇到的问题
      description: 现在得怎么做，哪一步最烦。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么用
      description: 描述理想的操作路径，不必是代码方案。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代办法
      description: 比如「现在只能去控制台手动改」。
  - type: dropdown
    id: contribute
    attributes:
      label: 愿意自己提 PR 吗
      options:
        - 可以，我来写
        - 可以帮忙测试
        - 只提需求
    validations:
      required: true
